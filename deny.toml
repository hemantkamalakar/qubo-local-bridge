# Checked by cargo-deny in CI. Run it locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# Advisories that we accept. Each entry names the reason.
# Re-check them when rumqttd, rumqttc or rmcp publish a new release.
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained. Only rumqttc and rumqttd read PEM files with it. No fix exists." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained. Only rmcp and schemars use it. No fix exists." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
