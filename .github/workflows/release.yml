name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, binary: qubo.exe, archive: zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x64, binary: qubo, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, binary: qubo, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64, binary: qubo, archive: tar.gz }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          stage="qubo-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md LICENSE NOTICE CHANGELOG.md "$stage/"
          cp -r skills "$stage/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$stage.zip" "$stage"
          else
            tar czf "$stage.tar.gz" "$stage"
          fi
          # macOS runners have no sha256sum.
          { sha256sum "$stage.${{ matrix.archive }}" || shasum -a 256 "$stage.${{ matrix.archive }}"; } > "$stage.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            qubo-*.zip
            qubo-*.tar.gz
            qubo-*.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
