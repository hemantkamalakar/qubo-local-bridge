name: Feature request
description: Suggest a new feature or a new device.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: device
    attributes:
      label: Device information
      description: For a new device, give the model and, if you know them, the MQTT topics and payloads. Remove private IDs.
